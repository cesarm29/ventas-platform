services:
  - type: web
    name: ventas-api-gateway
    runtime: docker
    dockerfilePath: ./microservices/api-gateway/Dockerfile
    rootDir: .
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: AUTH_SERVICE_URL
        value: https://ventas-auth-service.onrender.com
      - key: PRODUCT_SERVICE_URL
        value: https://ventas-product-service.onrender.com
      - key: ORDER_SERVICE_URL
        value: https://ventas-order-service.onrender.com

  - type: web
    name: ventas-auth-service
    runtime: docker
    dockerfilePath: ./microservices/auth-service/Dockerfile
    rootDir: .
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: ventas-product-service
    runtime: docker
    dockerfilePath: ./microservices/product-service/Dockerfile
    rootDir: .
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_ENABLED
        value: "false"

  - type: web
    name: ventas-order-service
    runtime: docker
    dockerfilePath: ./microservices/order-service/Dockerfile
    rootDir: .
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: PRODUCT_SERVICE_URL
        value: https://ventas-product-service.onrender.com
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_ENABLED
        value: "false"
