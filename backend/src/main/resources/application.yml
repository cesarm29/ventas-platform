server:
  port: ${PORT:10000}

spring:
  application:
    name: ventas-platform-api
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 30
          order_inserts: true
          order_updates: true

jwt:
  secret: ${JWT_SECRET:MySuperSecretKey2026ForVentasPlatformJwtTokenGenerationMustBeAtLeast32Bytes!!}
  expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.ventasplatform: INFO
    org.springframework.security: WARN
