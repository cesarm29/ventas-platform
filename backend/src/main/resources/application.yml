server:
  port: ${PORT:8080}

spring:
  application:
    name: ventas-platform-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ventas_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      ssl-mode: require
      ssl: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 30
          order_inserts: true
          order_updates: true

jwt:
  secret: ${JWT_SECRET:MySuperSecretKey2026ForVentasPlatformJwtTokenGenerationMustBeAtLeast32Bytes!!}
  expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.ventasplatform: INFO
    org.springframework.security: WARN
